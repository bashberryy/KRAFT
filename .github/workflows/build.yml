name: Build KRAFT

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Board name'
        required: true
        default: 'nissa'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [nissa, brya, corsola, grunt, octopus, dedede, volteer, hatch, zork, puff, trogdor, strongbad, jacuzzi, kukui, coral, eve, rammus, reef, elm, hana, samus]
      max-parallel: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 unzip curl wget
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
      - name: Download and build
        run: |
          python3 build.py ${{ matrix.board }}
      - name: Validate output
        run: |
          BOARD=${{ matrix.board }}
          ZIP="dist/kraft_${BOARD}.zip"
          [ -s "$ZIP" ] || exit 1
          unzip -l "$ZIP"
          COUNT=$(unzip -Z1 "$ZIP" | grep -c '\.bin$' || true)
          [ "$COUNT" -eq 1 ] || exit 1
          sha256sum "$ZIP"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kraft-${{ matrix.board }}
          path: dist/kraft_${{ matrix.board }}.zip
          retention-days: 14
