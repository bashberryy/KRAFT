description "tpmstatedem startup"
author "tpmstatedem"
start on stopped pre-startup
script
  C=/dev/console
  cat /etc/issue > $C 2>/dev/null || echo "  TPMstateDEM" > $C
  echo "[tpmstatedem] board:  $(crossystem hwid 2>/dev/null | awk '{print $1}')" > $C
  echo "[tpmstatedem] kernel: $(uname -r)" > $C
  echo "[tpmstatedem] kernver: $(crossystem tpm_kernver 2>/dev/null)" > $C
  echo "[tpmstatedem] cpu:    $(grep 'model name' /proc/cpuinfo | head -1 | cut -d: -f2 | sed 's/^ *//')" > $C
  echo "[tpmstatedem] ram:    $(awk '/MemTotal/{print int($2/1024)}' /proc/meminfo)MB" > $C
  modprobe usb-storage 2>/dev/null || true
  sleep 1
  exec chromeos_startup
end script
